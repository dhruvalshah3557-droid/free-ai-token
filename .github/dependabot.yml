# Actions are pinned to commit SHAs in .github/workflows, so nothing floats to a
# new release on its own. Dependabot is what moves those pins forward.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # The root lockfile covers the shared, server, client, and CLI workspaces.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      compatible-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # The Electron desktop application has its own independent lockfile.
  - package-ecosystem: "npm"
    directory: "/desktop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      compatible-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
